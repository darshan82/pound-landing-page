<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pounding Email Templete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="style.css" rel="stylesheet" />
</head>

<body>
    <main class="main_container">
        <header class="header">
            <div class="header_logo_container">
                <img height="34px" src="public/logo.png" />
                <img src="public//logo_text.png">
            </div>
            <p>1/1/2020</p>

        </header>


        <body>
            <div class="email_content_upper">
                <img width="180px" height="40px" src="public/logo_pound.png" />
                <img width="88px" src="public/girl_avatar.png" />
                <p style="font-weight: 700;">[ Player Tag ]</p>

            </div>
            <div style="padding: 10px;">
                <p style="font-weight: 700;">Hey [ First name ],</p>
                <p>Thank you for joining the POUND Team of testers.</p>
                <p>POUND is on a mission to elevate gamers performance in-game and out.</p>
                <p>Stay tuned as we gear up for the launch of POUND Beta!</p>

            </div>
        </body>
        <footer class="footer">
            <p style="color: white;">Follow Us</p>
            <div class="social_container">
                <img  src="public/twitter_icon.png" alt="twit_logo" />
                <img  src="public/insta_icon.png" alt="twit_logo" />
                <img  src="public/discord_icon.png" alt="twit_logo" />
            </div>
            <img width="34px" style="margin-top: 20px;" src="public/logo.png" alt="logo" />
            <p>POUND Gaming</p>
        </footer>

    </main>
</body>

</html>
